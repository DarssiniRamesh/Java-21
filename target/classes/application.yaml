server:
  port: ${SERVER_PORT:3001}
  address: ${SERVER_ADDRESS:0.0.0.0}

spring:
  application:
    name: java-21-backend
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        # Do NOT set a global PostgreSQL dialect; dev (H2) should auto-detect to avoid PG-specific DDL.
        jdbc:
          time_zone: UTC

# Feature flags and app-level settings
app:
  cors:
    # When true, enable a global allow-all CORS configuration (all origins/headers/methods, allowCredentials=false).
    # Default is true but can be disabled by setting the environment variable ALLOW_ALL_CORS=false.
    allow-all: ${ALLOW_ALL_CORS:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /openapi.json
  swagger-ui:
    path: /docs

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:modernrepo;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    driver-class-name: org.h2.Driver
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    properties:
      hibernate:
        # Allow Hibernate to auto-detect H2; alternatively could set H2Dialect explicitly if desired:
        # dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
  h2:
    console:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    # Prefer PG-prefixed env vars if provided by the orchestrator, fallback to standard SPRING_* names, then to defaults.
    url: ${PGSPRING_DATASOURCE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/modernrepo}}
    driver-class-name: org.postgresql.Driver
    username: ${PGSPRING_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
    password: ${PGSPRING_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
